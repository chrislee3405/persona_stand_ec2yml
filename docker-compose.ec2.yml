services:
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-2.amazonaws.com/persona_stand/backend:${IMAGE_TAG:-main}
    container_name: persona_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-wif-config.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
    volumes:
      - ~/secrets/gcp-wif-config.json:/app/secrets/gcp-wif-config.json:ro
    networks:
      - persona_network
    restart: unless-stopped

  frontend:
    # Prebuilt in CI and pushed to ECR (same as backend). The CloudFront
    # base URL is hardcoded in the frontend source (src/lib/assetUrl.ts),
    # so there is nothing to configure here.
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-2.amazonaws.com/persona_stand/frontend:${IMAGE_TAG:-main}
    container_name: persona_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - persona_network
    restart: unless-stopped

networks:
  persona_network:
    driver: bridge