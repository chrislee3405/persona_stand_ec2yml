services:
  backend:
    # Independent repositories have different commits. Select the exact pair
    # from the successful promotion artifact, never a shared moving tag.
    image: ${ECR_ACCOUNT_ID:?Set ECR_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:?Set AWS_REGION}.amazonaws.com/persona_stand/backend@${BACKEND_DIGEST:?Set promoted BACKEND_DIGEST}
    container_name: persona_backend
    # `expose`, not `ports`. Publishing 8000 bound it to 0.0.0.0 on the EC2
    # host, so the only thing between the internet and an unauthenticated
    # FastAPI instance -- /docs and /openapi.json included -- was a security
    # group rule. The frontend reaches this over the compose network by
    # service name, so nothing needed the mapping. To debug from the host,
    # use `docker compose exec` or temporarily bind 127.0.0.1:8000:8000.
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # INFO, whatever else is going on. DEBUG makes the reply pipeline write
      # every visitor's full prompt, history and model response to this
      # container's stdout. (This used to be tied to ENV=production, which
      # could not be set before TLS -- see app/runtime_settings.py.)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # false UNTIL THE SITE IS HTTPS END TO END, then true in this
      # instance's .env (Part A, "HTTPS with Let's Encrypt", last step).
      #
      # A browser NEVER sends a Secure cookie over plain http://, so turning
      # this on early empties every visitor's session on every request.
      # Consent stops sticking, every chat turn returns 403, and every message
      # opens a new conversation. The static site keeps working, which makes
      # it look like a chat bug rather than a config change.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-wif-config.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
    volumes:
      - ~/secrets/gcp-wif-config.json:/app/secrets/gcp-wif-config.json:ro
    networks:
      - persona_network
    restart: unless-stopped
    # Bounded, and it was not. The json-file driver has no max-size or
    # max-file by default, so the log grew until the root volume filled -- at
    # which point Docker cannot write, containers wedge, and recovery over SSH
    # is awkward because there is no space left for anything.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # Built in GHCR, browser-tested, then copied unchanged to ECR (same as backend). The CloudFront
    # base URL is baked in at BUILD time from the VITE_CDN_BASE repository
    # variable -- it reaches the JS bundle, index.html and nginx's CSP from
    # that one value -- so there is nothing to configure here.
    image: ${ECR_ACCOUNT_ID:?Set ECR_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:?Set AWS_REGION}.amazonaws.com/persona_stand/frontend@${FRONTEND_DIGEST:?Set promoted FRONTEND_DIGEST}
    container_name: persona_frontend
    ports:
      # Host 80 -> container 8080, host 443 -> container 8443. The image runs
      # nginx as the non-root `nginx` user, which cannot bind ports below
      # 1024 inside the container. Nothing changes for a visitor: the site is
      # still on :80 and :443. 443 answers nothing until TLS_DOMAIN is set.
      - "80:8080"
      - "443:8443"
    environment:
      # Empty (the default): plain HTTP, exactly as before. Set to the site's
      # domain in this instance's .env once its certificate exists, and the
      # container serves HTTPS on 443 and redirects 80 to it. The container
      # REFUSES TO START if this is set and the certificate is missing --
      # see nginx/select-mode.sh in the frontend repo.
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      # Seconds browsers remember "HTTPS only" for this domain. Starts at 5
      # minutes so a broken certificate cannot lock visitors out for long;
      # raise to 31536000 (a year) after a few days of working HTTPS.
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-300}
    volumes:
      # certbot on this host writes challenge files here (webroot), and the
      # container serves them on port 80 -- in both modes.
      - ./certbot-www:/var/www/certbot:ro
      # The certificate and key, copied here by ops/certbot-deploy-hook.sh,
      # owned by the container's nginx user. Read-only: the container never
      # writes them.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - persona_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  persona_network:
    driver: bridge
