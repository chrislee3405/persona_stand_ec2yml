name: Combined browser tests

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      frontend_image:
        description: 'Frontend GHCR image@sha256:digest (leave all inputs empty to use release-versions.json)'
        type: string
      frontend_revision:
        description: 'Full frontend commit SHA'
        type: string
      backend_image:
        description: 'Backend GHCR image@sha256:digest'
        type: string
      backend_revision:
        description: 'Full backend commit SHA'
        type: string

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: npm run test:e2e:list
      - name: Validate test Compose configuration without starting services
        env:
          TEST_FRONTEND_IMAGE: frontend:configuration-check
          TEST_BACKEND_IMAGE: backend:configuration-check
        run: docker compose --env-file tests/compose.env -f docker-compose.test.yml config --quiet

  combined-browser:
    needs: configuration
    # Fork code never gets private package credentials. A maintainer can select its built
    # pair in a trusted branch or manual run after reviewing the changes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      INPUT_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      INPUT_FRONTEND_REVISION: ${{ inputs.frontend_revision }}
      INPUT_BACKEND_IMAGE: ${{ inputs.backend_image }}
      INPUT_BACKEND_REVISION: ${{ inputs.backend_revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select and validate the intended pair
        id: release
        run: npm run release:validate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull images and verify their source revisions
        run: node scripts/verify-images.mjs
      - name: Checkout backend test support matching the image
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/persona_stand_back
          ref: ${{ steps.release.outputs.backend_revision }}
          path: backend-source
          # Public repos need no extra secret. Private repos need a read-only
          # fine-grained token with access to persona_stand_back.
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run selected pair through the browser
        env:
          BACKEND_TESTS_PATH: ./backend-source/tests
        run: npm run test:e2e
      - name: Preserve the result, versions, logs, and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selected-release.json
            test-results/
            playwright-report/
          retention-days: 90
