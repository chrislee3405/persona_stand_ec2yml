name: Combined browser tests

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: npm run test:e2e:list
      - name: Validate test Compose configuration without starting services
        env:
          TEST_FRONTEND_IMAGE: frontend:configuration-check
          TEST_BACKEND_IMAGE: backend:configuration-check
        run: docker compose --env-file tests/compose.env -f docker-compose.test.yml config --quiet

  combined-browser:
    needs: configuration
    # Fork code never gets private package credentials. A maintainer can select its built
    # pair in a trusted branch or manual run after reviewing the changes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install registry inspection tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Wait for both tested images with this release marker
        run: python3 scripts/resolve_release.py
      - name: Validate the resolved immutable pair
        id: release
        env:
          RELEASE_SELECTION_FILE: resolved-release.json
        run: npm run release:validate
      - name: Pull images and verify their source revisions
        run: node scripts/verify-images.mjs
      - name: Checkout backend test support matching the image
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/persona_stand_back
          ref: ${{ steps.release.outputs.backend_revision }}
          path: backend-source
          # Public repos need no extra secret. Private repos need a read-only
          # fine-grained token with access to persona_stand_back.
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run selected pair through the browser
        env:
          BACKEND_TESTS_PATH: ./backend-source/tests
        run: npm run test:e2e
      - name: Preserve the result, versions, logs, and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selected-release.json
            test-results/
            playwright-report/
          retention-days: 90
